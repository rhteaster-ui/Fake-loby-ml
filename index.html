<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Montserrat"', 'sans-serif'], 
                        body: ['"Nunito Sans"', 'sans-serif'] 
                    },
                    colors: {
                        ml: {
                            sky: '#4ba3e3',      
                            deepsky: '#2b7bc0',  
                            cloud: '#e6f3ff',    
                            crystal: '#8de4ff',  
                            palegold: '#fef6d8', 
                            goldtext: '#7a5b22', 
                        }
                    },
                    animation: {
                        'float-slow': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 15px rgba(141, 228, 255, 0.4)' },
                            '50%': { opacity: .7, boxShadow: '0 0 5px rgba(141, 228, 255, 0.1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Reset & Smooth Scroll */
        body { 
            background-color: #4ba3e3; 
            color: #ffffff; 
            overflow-x: hidden; 
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Latar Belakang Langit & Awan (Celestial Theme) */
        .sky-bg {
            position: fixed; inset: 0; z-index: -2;
            background: linear-gradient(180deg, #2b7bc0 0%, #4ba3e3 40%, #a6d8fc 75%, #e6f3ff 100%);
        }

        .clouds {
            position: fixed; bottom: -10vh; left: 0; width: 100vw; height: 50vh; z-index: -1;
            background: 
                radial-gradient(circle at 20% 100%, rgba(255,255,255,0.8) 0%, transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(255,255,255,0.6) 0%, transparent 60%),
                radial-gradient(circle at 50% 120%, rgba(255,255,255,1) 0%, transparent 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        /* Light Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 50, 100, 0.15), inset 0 2px 0 rgba(255,255,255,0.4);
        }

        /* Input Cerah */
        .game-input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .game-input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .game-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            border-color: #8de4ff;
            box-shadow: 0 0 15px rgba(141, 228, 255, 0.5);
        }

        /* Tombol Pale Gold */
        .btn-action {
            background: linear-gradient(to bottom, #ffffff, #fef6d8, #e8ce8a);
            color: #7a5b22;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15), inset 0 2px 0 rgba(255,255,255,0.8);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-action::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.8), transparent);
            transform: rotate(45deg) translateY(-100%);
            transition: 0.5s;
        }
        .btn-action:hover::after { transform: rotate(45deg) translateY(100%); }
        .btn-action:hover { box-shadow: 0 6px 20px rgba(232, 206, 138, 0.6); transform: translateY(-2px); }
        .btn-action:active { transform: translateY(1px); }

        /* Teks Shadows */
        .text-shadow-hard { text-shadow: 0 2px 4px rgba(0, 30, 60, 0.6); }
        .text-shadow-soft { text-shadow: 0 1px 2px rgba(0, 30, 60, 0.4); }
    </style>
</head>

        <i id="toastIcon" class="ph-fill ph-info text-xl text-ml-sky"></i>
        <span id="toastMsg">System Notice</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const sysToast = document.getElementById('sysToast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            let toastTimer;

            function showNotify(msg, isError = true) {
                clearTimeout(toastTimer);
                toastMsg.textContent = msg;
                
                if(isError) {
                    toastIcon.className = 'ph-fill ph-warning-circle text-red-500 text-xl';
                    sysToast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-red-50/90 backdrop-blur-md border border-red-200 text-red-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-bold z-50 transform -translate-y-[150%] opacity-0 transition-all duration-400 ease-out';
                } else {
                    toastIcon.className = 'ph-fill ph-check-circle text-green-500 text-xl';
                    sysToast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md border border-white/50 text-blue-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-bold z-50 transform -translate-y-[150%] opacity-0 transition-all duration-400 ease-out';
                }

                setTimeout(() => {
                    sysToast.classList.remove('-translate-y-[150%]', 'opacity-0');
                    sysToast.classList.add('translate-y-0', 'opacity-100');
                }, 10);

                toastTimer = setTimeout(() => {
                    sysToast.classList.remove('translate-y-0', 'opacity-100');
                    sysToast.classList.add('-translate-y-[150%]', 'opacity-0');
                }, 3000);
            }

            let uploadedImageBase64 = '';
            document.getElementById('avatarInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    if(file.size > 2 * 1024 * 1024) return showNotify("Ukuran foto maksimal 2MB");
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        uploadedImageBase64 = e.target.result;
                        const preview = document.getElementById('avatarPreview');
                        preview.style.backgroundImage = `url(${uploadedImageBase64})`;
                        preview.classList.remove('hidden');
                        document.getElementById('avatarIcon').classList.add('hidden');
                    }
                    reader.readAsDataURL(file);
                }
            });

            const listRank = [
                { id: 'gm', name: 'Grandmaster', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=GM' },
                { id: 'epic', name: 'Epic', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=EPIC' },
                { id: 'legend', name: 'Legend', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=LGD' },
                { id: 'mawi', name: 'Mawi', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=MAWI' },
                { id: 'honor', name: 'Honor', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=HNR' },
                { id: 'glory', name: 'Glory', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=GLRY' },
                { id: 'imo', name: 'Immortal', img: 'https://placehold.co/100x100/2b7bc0/ffffff?text=IMO' }
            ];
            
            const rContainer = document.getElementById('rankContainer');
            const inputRank = document.getElementById('rank');
            const labelRank = document.getElementById('rankLabel');

            function buildRankButtons() {
                rContainer.innerHTML = '';
                listRank.forEach(item => {
                    const btn = document.createElement('div');
                    const isAktif = item.id === inputRank.value;
                    
                    btn.className = `snap-center shrink-0 w-16 h-16 rounded-xl cursor-pointer transition-all duration-300 border-2 overflow-hidden bg-white/10 p-1 ${isAktif ? 'border-white scale-110 shadow-[0_0_15px_rgba(254,246,216,0.8)]' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    btn.innerHTML = `<img src="${item.img}" alt="${item.name}" class="w-full h-full object-contain drop-shadow-md rounded-lg">`;
                    
                    btn.addEventListener('click', () => {
                        inputRank.value = item.id;
                        labelRank.textContent = item.name;
                        buildRankButtons(); 
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    });
                    rContainer.appendChild(btn);
                });
            }
            buildRankButtons();

            const bContainer = document.getElementById('borderContainer');
            const inputBorder = document.getElementById('border');
            const labelBorder = document.getElementById('borderLabel');

            function buildBorderButtons() {
                bContainer.innerHTML = '';
                for(let i = 0; i <= 16; i++) {
                    const btn = document.createElement('div');
                    const isAktif = i.toString() === inputBorder.value;
                    
                    const imgUrl = `https://placehold.co/100x100/2b7bc0/ffffff?text=B${i}`;

                    btn.className = `snap-center shrink-0 w-16 h-16 rounded-xl cursor-pointer transition-all duration-300 border-2 overflow-hidden bg-white/10 p-1 ${isAktif ? 'border-white scale-110 shadow-[0_0_15px_rgba(254,246,216,0.8)]' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    btn.innerHTML = `<img src="${imgUrl}" alt="Border ${i}" class="w-full h-full object-contain drop-shadow-md rounded-lg">`;
                    
                    btn.addEventListener('click', () => {
                        inputBorder.value = i;
                        labelBorder.textContent = i === 0 ? 'ID: 0 (Default)' : `ID: ${i}`;
                        buildBorderButtons(); 
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    });
                    bContainer.appendChild(btn);
                }
            }
            buildBorderButtons();

            document.getElementById('generatorForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const uname = document.getElementById('username').value.trim();
                const rankVal = inputRank.value;
                const borderVal = inputBorder.value;

                if(!uname) {
                    document.getElementById('username').focus();
                    return showNotify("Nama player tidak boleh kosong!");
                }

                const btn = document.getElementById('generateBtn');
                const btnIcon = document.getElementById('btnIcon');
                const btnText = document.getElementById('btnText');
                const btnLoader = document.getElementById('btnLoader');
                
                // Nyalakan UI Loading
                btn.classList.add('opacity-80', 'pointer-events-none');
                btnIcon.classList.add('hidden');
                btnLoader.classList.remove('hidden');

                try {
                    let finalAvatarUrl = 'default';

                    if (uploadedImageBase64) {
                        btnText.textContent = 'Mengunggah Avatar...';
                        
                        const uploadRes = await fetch('/api/upload', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ imageBase64: uploadedImageBase64 })
                        });
                        
                        const uploadData = await uploadRes.json();
                        
                        if (uploadData.success && uploadData.url) {
                            finalAvatarUrl = uploadData.url;
                        } else {
                            throw new Error("Gagal mengunggah foto ke server");
                        }
                    }

                    btnText.textContent = 'Memproses Canvas...';

                    const genRes = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            avatarUrl: finalAvatarUrl,
                            username: uname,
                            rank: rankVal,
                            border: borderVal
                        })
                    });

                    const genData = await genRes.json();

                    if (genData.success && genData.imageUrl) {
                        const resultBox = document.getElementById('resultBox');
                        const resultImg = document.getElementById('resultImg');
                        const downloadBtn = document.getElementById('downloadBtn');
                        
                        resultImg.src = genData.imageUrl;
                        downloadBtn.href = genData.imageUrl;
                        
                        resultBox.classList.remove('hidden');
                        showNotify("Canvas berhasil dibuat!", false); 
                        
                        setTimeout(() => resultBox.scrollIntoView({ behavior: 'smooth', block: 'end' }), 100);
                    } else {
                        throw new Error(genData.error || "Module gagal memproses gambar");
                    }

                } catch (err) {
                    showNotify(err.message, true); 
                } finally {
                    btn.classList.remove('opacity-80', 'pointer-events-none');
                    btnIcon.classList.remove('hidden');
                    btnText.textContent = 'Generate Card';
                    btnLoader.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
